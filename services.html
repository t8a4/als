<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Services | Alstrategy</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="style.css">

  <style>
    :root {
      --primary: #6366f1;
      --primary-light: rgba(99, 102, 241, 0.1);
      --secondary: #14b8a6;
      --accent: #f97316;
      --success: #22c55e;
      --warning: #eab308;
      --error: #ef4444;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-800: #1f2937;
      --gray-900: #111827;
      --dark: #0f172a;
      --card-bg: #1e293b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0f0a1f;
      color: white;
      line-height: 1.5;
      min-height: 100vh;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 3rem 1rem;
    }

    @media (min-width: 768px) {
      .container {
        padding: 3rem 2rem;
      }
    }

    .page-title {
      font-size: 2.5rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 4rem;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeIn 0.5s ease-out forwards;
    }

    @media (min-width: 768px) {
      .page-title {
        font-size: 3.75rem;
      }
    }

    .services-grid {
      display: grid;
      gap: 2rem;
    }

    @media (min-width: 768px) {
      .services-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .card {
      background-color: #1a1333;
      border-radius: 1rem;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      height: 100%;
      opacity: 0;
      transform: translateY(20px);
    }

    .card-header {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .icon-container {
      width: 4rem;
      height: 4rem;
      padding: 1rem;
      background-color: #261646;
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon {
      width: 2rem;
      height: 2rem;
      color: #9333ea;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon svg {
      width: 100%;
      height: 100%;
    }

    .card-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }

    .card-description {
      color: var(--gray-400);
      margin-bottom: 1.5rem;
    }

    .content-container {
      flex: 1;
    }

    .btn1 {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background-color: #9333ea;
      color: white;
      border: none;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      margin-top: auto;
      transition: all 0.2s ease;
    }

    .btn1:hover {
      background-color: #7E22CE;
      transform: translateY(-2px);
    }

    .btn1-icon {
      width: 1.25rem;
      height: 1.25rem;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
    <div class="min-h-screen" style="padding-top: 120px;">
  <div class="container">
    <h1 class="page-title">Explore Our Services</h1>

    <div class="services-grid" id="services-container">
      <!-- Service cards will be inserted here by JavaScript -->
    </div>
  </div>

  <script>
    // Services data
    const services = [
      {
        icon: 'bot',
        title: 'AI Solutions',
        description: 'Transform your customer service with intelligent chatbots that never sleep. Automate support, boost sales, and delight customers 24/7.',
        path: '/ai'
      },
      {
        icon: 'chart',
        title: 'Marketing Services',
        description: 'Get more clients and increase revenue with data-driven marketing strategies. We share the risk - you only win when we deliver results.',
        path: '/marketing'
      },
      {
        icon: 'globe',
        title: 'Website Development',
        description: 'Stand out online with a stunning, high-performance website that converts visitors into customers. From simple sites to complex web applications.',
        path: '/website'
      },
      {
        icon: 'development',
        title: 'Software Development',
        description: 'Turn your ideas into reality with custom software built for your business — scalable, reliable, and made to grow with you.',
        path: '/software-development'
      }
    ];

    // SVG icons
    const icons = {
      bot: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"></path><rect width="16" height="12" x="4" y="8" rx="2"></rect><path d="M2 14h2"></path><path d="M20 14h2"></path><path d="M15 13v2"></path><path d="M9 13v2"></path></svg>',
      chart: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"></path><path d="m19 9-5 5-4-4-3 3"></path></svg>',
      globe: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path><path d="M2 12h20"></path></svg>',
      development: '<svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>',
      arrow: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>'
    };

    // Create service cards
    function createServiceCards() {
      const container = document.getElementById('services-container');

      services.forEach((service, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.style.animationDelay = `${index * 0.1}s`;
        card.style.animation = 'fadeIn 0.5s ease-out forwards';

        card.innerHTML = `
          <div class="card-header">
            <div class="icon-container">
              <div class="icon">${icons[service.icon]}</div>
            </div>
            <div class="content-container">
              <h2 class="card-title">${service.title}</h2>
              <p class="card-description">${service.description}</p>
            </div>
          </div>
          <a href="${service.path}" class="btn1">
            Learn More <span class="btn1-icon">${icons.arrow}</span>
          </a>
        `;

        container.appendChild(card);
      });
    }

    // Initialize the page
    document.addEventListener('DOMContentLoaded', function() {
      createServiceCards();
    });
  </script>
    <script src="main.js"></script>

</body>
</html>
