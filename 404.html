<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error - Page Not Found</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0F0A1F;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .scanline {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0) 50%,
        rgba(0, 0, 0, 0.05) 51%
      );
      background-size: 100% 4px;
      pointer-events: none;
      animation: flicker 0.15s infinite;
    }

    @keyframes flicker {
      0% { opacity: 0.97; }
      50% { opacity: 1; }
      100% { opacity: 0.97; }
    }

    .container {
      max-width: 900px;
      padding: 40px;
      text-align: left;
      position: relative;
      z-index: 1;
    }

    .sad-face {
      font-size: clamp(80px, 20vw, 180px);
      font-weight: 300;
      margin-bottom: 30px;
      display: block;
    }

    .error-title {
      font-size: clamp(20px, 4vw, 32px);
      font-weight: 400;
      margin-bottom: 40px;
      line-height: 1.4;
    }

    .progress-container {
      margin-bottom: 50px;
    }

    .progress-text {
      font-size: clamp(14px, 2.5vw, 18px);
      margin-bottom: 10px;
      font-weight: 300;
    }

    .progress-percent {
      font-size: clamp(16px, 3vw, 22px);
      font-weight: 400;
      margin-top: 15px;
    }

    .details {
      margin-top: 60px;
      padding-top: 30px;
      border-top: 1px solid rgba(255, 255, 255, 0.3);
    }

    .actions {
      margin-top: 40px;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .link {
      text-decoration: none;
      padding: 8px 16px 6px 15px;
      color: #ffffff;
      font-size: clamp(16px, 2.5vw, 20px);
      font-weight: 400;
      display: inline-block;
      transition: all 0.1s ease;
      cursor: pointer;
    }

    .link:hover,
    .link:focus {
      background: #575463;
      color: #0F0A1F;
    }

    @media (max-width: 768px) {
      body {
        align-items: center;
        justify-content: center;
      }

      .container {
        padding: 30px 20px;
        text-align: left;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 100vh;
      }

      .actions {
        margin-top: auto;
      }
    }
  </style>
</head>
<body>
  <div class="scanline"></div>
  <audio id="errorSound" src="404-sound.mp3"></audio>

  <div class="container">
    <div class="sad-face">:(</div>

    <div class="error-title">
      Oops! The page you are looking does not exist. You may have misstyped the address or the page may have been moved.
    </div>

    <div class="progress-container">
      <div class="progress-text">Loading error information...</div>
      <div class="progress-percent"><span id="percent">0</span>% complete</div>
    </div>

    <div class="details">
      <div class="actions">
        <a href="/" class="link">Go Home</a>
      </div>
    </div>
  </div>

  <script>
    let progress = 0;
    const percentElement = document.getElementById('percent');
    const errorSound = document.getElementById('errorSound');

    window.addEventListener('load', () => {
      errorSound.play().catch(() => {});
    });

    function updateProgress() {
      if (progress < 100) {
        progress += Math.random() * 3;
        if (progress > 100) progress = 100;
        percentElement.textContent = Math.floor(progress);

        const delay = Math.random() * 200 + 100;
        setTimeout(updateProgress, delay);
      } else {
        percentElement.textContent = '100';
        setTimeout(() => {
          document.querySelector('.progress-text').textContent = 'Collection complete. Waiting for user action...';
        }, 500);
      }
    }

    setTimeout(updateProgress, 500);
  </script>
</body>
</html>
