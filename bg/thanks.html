<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Благодарим ви | Alstrategy</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Gabriela&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <style>
    .thank_you-page {
      min-height: 100vh;
      padding: 160px 24px 96px;
      background: var(--color-dark);
      color: var(--color-white);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .thank_you-card {
      width: min(720px, 100%);
      text-align: center;
      background: var(--color-dark-light);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: clamp(36px, 6vw, 72px);
      box-shadow: var(--shadow-lg);
    }

    .thank_you-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 28px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: rgba(147, 51, 234, 0.14);
      color: var(--color-primary-light);
      border: 1px solid rgba(168, 85, 247, 0.28);
    }

    .thank_you-card h1 {
      font-size: clamp(2.2rem, 5vw, 4rem);
      line-height: 1;
      letter-spacing: -0.045em;
      color: var(--color-primary);
      margin-bottom: 20px;
    }

    .thank_you-card p {
      color: var(--color-gray-400);
      font-size: 1.05rem;
      max-width: 540px;
      margin: 0 auto 32px;
      line-height: 1.7;
    }

    .thank_you-actions {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .thank_you-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 22px;
      border-radius: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: var(--transition-normal);
    }

    .thank_you-btn_primary {
      background: var(--color-primary);
      color: var(--color-white);
      box-shadow: 0 16px 36px rgba(147, 51, 234, 0.25);
    }

    .thank_you-btn_primary:hover {
      background: var(--color-primary-light);
      transform: translateY(-2px);
    }

    .thank_you-btn_secondary {
      background: var(--color-dark-lighter);
      color: var(--color-white);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .thank_you-btn_secondary:hover {
      border-color: rgba(168, 85, 247, 0.5);
      transform: translateY(-2px);
    }

    @media (max-width: 640px) {
      .thank_you-page {
        padding: 130px 16px 64px;
      }

      .thank_you-actions {
        flex-direction: column;
      }

      .thank_you-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="thank_you-page">
    <section class="thank_you-card">
      <div class="thank_you-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34"
          viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6 9 17l-5-5"></path>
        </svg>
      </div>

      <h1>Благодарим ви!</h1>

      <p>
        Вашето запитване за проек беше изпратено успешно. Ще прегледаме вашето съобщение и ще се свържем с вас скоро за следващата стъпка.
      </p>

      <div class="thank_you-actions">
        <a href="https://facebook.com/alstrategize" class="thank_you-btn thank_you-btn_primary">
          Последвайте ни във фейсбук
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
            viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"></path>
            <path d="m12 5 7 7-7 7"></path>
          </svg>
        </a>

        <a href="/bg/" class="thank_you-btn thank_you-btn_secondary">
          Начална страница
        </a>
      </div>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
